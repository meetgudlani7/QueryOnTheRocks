[pytest]
markers =
    live: needs a real GROQ_API_KEY (or other live external credential) to produce a correct result — not just "makes a network call," but "would assert the wrong thing without one." Excluded from CI's default run (`pytest -m "not live"`, roadmap Phase 24) since GitHub Actions doesn't expose secrets to workflows triggered by fork PRs; run explicitly with `pytest -m live` when credentials are available.
