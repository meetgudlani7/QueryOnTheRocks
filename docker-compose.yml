services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Pre-built BM25 index (scripts/build_index.py) — loaded at startup,
      # not rebuilt in the container.
      - ./data:/app/data
      # Persists the downloaded embedding model across restarts instead of
      # re-fetching it from Hugging Face on every container start.
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hf_cache:
